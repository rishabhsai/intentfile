intent: intentfile/v0.1
id: intent_password_reset_demo
title: Add password reset flow
created_at: 2026-05-15T12:00:00Z
objective: >
  Implement an email-based password reset flow for existing users.
background: >
  The app already supports email/password sign-in, but users cannot recover
  access when they forget their password.
context:
  repo: github:acme/app
  issue: github:acme/app#184
  branch: feature/password-reset
inputs:
  files:
    - src/auth/**
    - src/email/**
    - prisma/schema.prisma
constraints:
  allowed_paths:
    - src/**
    - prisma/**
    - tests/**
    - docs/**
  denied_paths:
    - .env
    - .env.*
    - infra/production/**
  allowed_tools:
    - shell
    - git
    - browser
  denied_tools:
    - email.send
    - payment.charge
    - secrets.read
  data_rules:
    - Do not expose secrets.
    - Do not modify production configuration.
    - Do not send real emails during tests.
budgets:
  max_runtime_minutes: 60
  max_files_changed: 12
acceptance:
  - id: A1
    statement: Users can request a password reset link by email.
  - id: A2
    statement: Reset tokens expire after one hour.
  - id: A3
    statement: Reset tokens are single-use.
  - id: A4
    statement: Users can set a new password using a valid reset token.
  - id: A5
    command: npm test
    must_pass: true
  - id: A6
    command: npm run lint
    must_pass: true
deliverables:
  - type: code
    description: Implementation changes.
  - type: tests
    description: Automated tests for token expiry and single-use behavior.
  - type: docs
    description: Brief documentation update if behavior changes.
proof_required:
  - changed_files
  - tests_run
  - acceptance_checklist
  - unresolved_questions
  - risk_notes
metadata:
  priority: high
  owner: alice
  labels:
    - auth
    - security
    - agent-ready
